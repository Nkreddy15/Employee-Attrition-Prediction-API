name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test the committed serving artifacts
        run: pytest -q
      - name: Verify training can regenerate compatible artifacts
        run: python train_model.py
      - name: Test the regenerated artifacts
        run: pytest -q
      - name: Build and smoke-test the container
        run: |
          docker build -t employee-attrition-api .
          docker run -d --name attrition -p 7860:7860 employee-attrition-api
          trap 'docker logs attrition; docker rm -f attrition' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 2 --fail http://localhost:7860/health
          curl --fail http://localhost:7860/form > /dev/null
          curl --fail -H 'Content-Type: application/json' --data-binary @examples/request.json http://localhost:7860/predict
          curl --fail http://localhost:7860/metrics
